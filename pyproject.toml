[project]
name = "ai-blackbox"
version = "0.0.0"
description = "AI Black Box — flight recorder for AI (Outer + Deep, hash-sealed)"
readme = "product.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "torch>=2.4",
  "safetensors>=0.4",
  "pyyaml>=6.0",
  "numpy>=1.26",
]
authors = [{ name = "AI Black Box contributors" }]

[project.optional-dependencies]
dev = ["ruff>=0.4", "mypy>=1.10", "pytest>=8.0"]
search = ["pyarrow>=15", "duckdb>=1.0"]

[project.scripts]
blackbox = "blackbox.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["blackbox*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
# NOTE: target is 3.12 (not the 3.10 runtime floor) because numpy>=2 ships
# PEP 695 stubs that mypy cannot parse at python_version 3.10. Runtime 3.10
# compat is still guarded by ruff target-version py310 (UP rules flag newer
# syntax). CI (ubuntu 3.11) is authoritative for the 3.10-3.12 range.
python_version = "3.12"
ignore_missing_imports = true
show_error_codes = true

[tool.pytest.ini_options]
markers = ["gpu: marks tests requiring Linux+NVIDIA GPU (deselect by default)"]

[dependency-groups]
